[package]
name = "reach"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
camino = "1.2.6"
clap = { version = "4.6.7", features = ["derive", "env"] }
etcetera = "0.11.0"
jiff = "0.2.37"
parse_datetime = "0.16.0"
pathdiff = { version = "0.2.3", features = ["camino"] }
rusqlite = { version = "0.40.2", features = ["bundled", "jiff"] }

[lints]
clippy.pedantic = { level = "warn", priority = -1 }
clippy.redundant_closure = "allow"

[profile.profile]
inherits = "release"
debug = "full"
